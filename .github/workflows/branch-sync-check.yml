name: Branch sync check

# Keeps master (documentation and planning) and draft/admin-portal (admin
# portal UI, layout and design) merge-ready. The rules are explained in
# "master and draft/admin-portal: merge readiness" in docs/Developers.md.

on:
  push:
    branches:
      - master
      - draft/admin-portal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge-readiness:
    name: Merge readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch both branches
        run: |
          git fetch --no-tags origin \
            "+refs/heads/master:refs/remotes/origin/master" \
            "+refs/heads/draft/admin-portal:refs/remotes/origin/draft/admin-portal"

      - name: Check that each branch only changes its own files
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          MASTER=origin/master
          ADMIN=origin/draft/admin-portal
          failed=0

          # Files changed on master since the two branches last shared history.
          check_master() {
            bad=$(git diff --name-only "$ADMIN...$MASTER" \
              | grep -vE '^(docs/|README\.md$|\.github/workflows/branch-sync-check\.yml$)' || true)
            if [ -n "$bad" ]; then
              echo "::error::master may only change docs/ and README.md. Move these changes to draft/admin-portal:"
              echo "$bad"
              failed=1
            fi
          }

          # Files changed on draft/admin-portal since the two branches last shared history.
          check_admin() {
            bad=$(git diff --name-only "$MASTER...$ADMIN" \
              | grep -E '^(docs/|README\.md$)' || true)
            if [ -n "$bad" ]; then
              echo "::error::draft/admin-portal must not edit documentation. Make the change on master, then run 'git merge origin/master' on draft/admin-portal:"
              echo "$bad"
              failed=1
            fi
          }

          case "$BRANCH" in
            master) check_master ;;
            draft/admin-portal) check_admin ;;
            *) check_master; check_admin ;;
          esac
          exit "$failed"

      - name: Test that the branches merge without conflicts
        run: |
          set -euo pipefail
          git config user.name "branch-sync-check"
          git config user.email "branch-sync-check@users.noreply.github.com"
          git checkout --quiet --detach origin/draft/admin-portal

          if git merge-base --is-ancestor origin/master HEAD; then
            echo "draft/admin-portal already contains all of master, so merging the two is a fast-forward."
            exit 0
          fi

          if git merge --no-commit --no-ff origin/master; then
            git merge --abort || true
            echo "::warning::draft/admin-portal is behind master but merges cleanly. Run 'git merge origin/master' on draft/admin-portal to catch up."
          else
            echo "::error::Merging master into draft/admin-portal has conflicts in:"
            git diff --name-only --diff-filter=U
            git merge --abort || true
            exit 1
          fi
