name: Test Backend

on:
  push:
    branches:
      - Foundation
      - master
      - draft/admin-portal
  pull_request:
permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The database is published on 5433 for host-side migration and tests.
      POSTGRES_PORT: "5433"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest-known"
      - name: Audit locked Python dependencies
        run: |
          uv export --locked --format requirements.txt --no-hashes --no-dev --no-emit-project --package app --output-file /tmp/requirements.txt
          uvx --from pip-audit pip-audit -r /tmp/requirements.txt
      # .env is intentionally not tracked; use placeholders for local CI. The
      # settings check refuses placeholder secrets outside development mode, so
      # CI (a throw-away database, never a real deployment) runs in development
      # mode, as .env.example says to for local testing.
      - name: Create CI .env from the example
        run: |
          cp .env.example .env
          printf '\nFASTAPI_ENV=development\nENABLE_DEV_ROUTES=true\n' >> .env
      - name: Configure host database port
        run: sed -i 's/localhost:5432/localhost:5433/' .env
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d --wait db mailpit
      - name: Migrate DB
        run: uv run bash scripts/prestart.sh
        working-directory: backend
      - name: Run tests
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: backend
      - run: docker compose down -v --remove-orphans
      - name: Store coverage files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
      - name: Coverage report
        run: uv run coverage report --fail-under=90
        working-directory: backend
