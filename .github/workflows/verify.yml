name: Verify offline deployment

on:
  push:
    branches:
      - Foundation
  pull_request:
    branches:
      - Foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-config:
    name: Validate Compose configuration
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: Barangay Mayondon Records and Document Issuance System
      SECRET_KEY: ci-only-placeholder-secret-key
      FIRST_SUPERUSER: ci-admin@example.com
      FIRST_SUPERUSER_PASSWORD: ci-only-placeholder-password
      POSTGRES_PASSWORD: ci-only-placeholder-database-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

  docker-build:
    name: Build application image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: mayondon-records:ci
