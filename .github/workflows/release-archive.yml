name: Release archive

# Decision 70: the office computer only receives the files in the .gitattributes
# allowlist. This job proves that archive still contains everything the system
# needs by building the Docker image from the archive alone, and tests the
# clean-up of old files on installed copies.

on:
  push:
    branches:
      - Foundation
      - master
      - draft/admin-portal
  pull_request:
    branches:
      - Foundation
      - master
      - draft/admin-portal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the archive contents
        run: sh scripts/verify-release-archive.sh
      - name: Test the clean-up of old files
        run: sh scripts/test-prune-release.sh
      - name: Test the PowerShell scripts (syntax and the update script)
        run: bash scripts/test-office-scripts.sh
      - name: Build the image from the archive alone
        run: |
          rm -rf "$RUNNER_TEMP/release" && mkdir -p "$RUNNER_TEMP/release"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          cp .env.example .env
          docker compose -f compose.yml build backend
      - name: Check the image carries no test or lint tools
        run: |
          cd "$RUNNER_TEMP/release"
          docker compose -f compose.yml run --rm --no-deps --entrypoint python backend -c \
            "import importlib.util as u; bad=[m for m in ('pytest','mypy','ruff','coverage') if u.find_spec(m)]; print('dev tools in image:', bad); raise SystemExit(bool(bad))"
      - name: Check every service has capped logs
        run: |
          cd "$RUNNER_TEMP/release"
          docker compose -f compose.yml --profile https config --format json > compose.json
          python3 - <<'PY'
          import json
          services = json.load(open("compose.json"))["services"]
          bad = [n for n, s in services.items()
                 if not s.get("logging", {}).get("options", {}).get("max-size")]
          print("services:", sorted(services), "without a log limit:", bad)
          raise SystemExit(bool(bad) or not services)
          PY
      - name: Check the program starts in the image and pg_dump matches the database
        run: |
          cd "$RUNNER_TEMP/release"
          # The program refuses the placeholder secrets of .env.example outside development,
          # so this step uses throw-away values (the shell overrides .env for Compose).
          export SECRET_KEY="$(openssl rand -hex 32)" POSTGRES_PASSWORD="$(openssl rand -hex 16)" FIRST_SUPERUSER_PASSWORD="$(openssl rand -hex 16)"
          docker compose -f compose.yml run --rm --no-deps --entrypoint python backend -c \
            "import app.main, app.backup_cli, app.migrate_on_start; print('program modules import')"
          docker compose -f compose.yml run --rm --no-deps --entrypoint pg_dump backend --version | grep -q "(PostgreSQL) 18"
      - name: Start the office stack from the archive and use it
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          # The same Compose file the office computer runs (-f compose.yml), with throw-away secrets.
          cp .env.example .env
          sed -i -E "s|^SECRET_KEY=.*|SECRET_KEY=$(openssl rand -hex 32)|; s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|; s|^FIRST_SUPERUSER_PASSWORD=.*|FIRST_SUPERUSER_PASSWORD=$(openssl rand -hex 16)|" .env
          echo "POSTGRES_PORT=5433" >> .env   # 5432 can be taken on a GitHub runner
          mkdir -p backups
          docker compose -f compose.yml up -d --wait --wait-timeout 300
          curl -fsS http://localhost:8000/api/v1/utils/health-check/
          docker compose -f compose.yml logs backend | grep "\[migrate\]"
          # Logs are capped, and the database port is open on this computer only (decision 74).
          for service in db backend; do
            id=$(docker compose -f compose.yml ps -q "$service")
            docker inspect --format '{{.HostConfig.LogConfig.Config}}' "$id" | grep -q "max-size:10m" \
              || { echo "$service has no log limit"; exit 1; }
          done
          docker compose -f compose.yml port db 5432 | grep -q "^127.0.0.1:" \
            || { echo "The database port is not bound to 127.0.0.1"; exit 1; }
          # First administrator, then a backup made the way the scheduled task makes it.
          docker compose -f compose.yml exec -T backend python app/initial_data.py
          docker compose -f compose.yml exec -T backend python -m app.backup_cli
          ls backups/mayondon-db-*.dump
          # Recreate the program container (what an update does): data and sign-in must survive.
          docker compose -f compose.yml up -d --force-recreate --wait --wait-timeout 300 backend
          password=$(grep '^FIRST_SUPERUSER_PASSWORD=' .env | cut -d= -f2-)
          curl -fsS -d "username=admin@example.com&password=$password" http://localhost:8000/api/v1/login/access-token | grep -q access_token
      - name: Stop the office stack
        if: always()
        run: |
          cd "$RUNNER_TEMP/release"
          docker compose -f compose.yml logs --tail 80 || true
          docker compose -f compose.yml down -v --remove-orphans || true
