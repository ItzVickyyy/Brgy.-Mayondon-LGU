name: Test Docker Compose

on:
  push:
    branches:
      - Foundation
      - master
  pull_request:
permissions:
  contents: read

jobs:

  test-docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # .env is intentionally not tracked; use placeholders for local CI.
      - run: cp .env.example .env
      - name: Keep Adminer out of the base Compose stack
        run: |
          if docker compose -f compose.yml config --services | grep -qx adminer; then
            echo "Adminer must only be available through the development override."
            exit 1
          fi
      - run: docker compose build
      - run: docker compose down -v --remove-orphans
      - run: docker compose run --rm backend bash scripts/prestart.sh
      - run: docker compose up -d --wait backend adminer
      - name: Test backend is up
        run: curl http://localhost:8000/api/v1/utils/health-check
      - name: Test frontend is up
        run: curl http://localhost:8000
      - run: docker compose down -v --remove-orphans
