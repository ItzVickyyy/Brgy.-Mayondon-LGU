services:
  db:
    image: postgres:18
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    ports:
      # Host-side development tools may connect locally. Do not expose the DB
      # on the office LAN; the backend container connects over Compose's network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Variable not set}
      POSTGRES_DB: app

  backend:
    image: backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        restart: true
    ports:
      # The application and API share this port. Office computers open
      # http://<server-computer-LAN-IP>:8000 from their browsers. With HTTPS
      # switched on (docs/11 section G item 7) set APP_BIND=127.0.0.1 so only
      # this computer can use plain HTTP and the office uses the HTTPS proxy.
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8000}:8000"
    environment:
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS: ${SMTP_TLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
      SENTRY_DSN: ${SENTRY_DSN:-}
      USERS_OPEN_REGISTRATION: ${USERS_OPEN_REGISTRATION:-false}
      BACKUP_DIR: /backups
      BACKUP_KEEP_COPIES: ${BACKUP_KEEP_COPIES:-14}
      BACKUP_REQUIRE_ENCRYPTION: ${BACKUP_REQUIRE_ENCRYPTION:-false}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
      PRE_MIGRATION_BACKUP: ${PRE_MIGRATION_BACKUP:-true}
      # Which senders may tell the app "this request came in over HTTPS".
      # Default: only this container itself. Set to * together with
      # COMPOSE_PROFILES=https (the backend is then reachable only through the
      # proxy and this computer).
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}

    volumes:
      # Backups made by the app appear in the repository's backups folder on
      # the host (git-ignored; dumps contain resident data).
      - ./backups:/backups

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Room for the start-up database update (app/migrate_on_start.py).
      start_period: 90s

    build:
      context: .
      dockerfile: backend/Dockerfile

  # HTTPS for the office network. Off unless COMPOSE_PROFILES=https is set in
  # .env, so applying an update never changes a running system by itself.
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTPS_PORT:-443}:443"
      # Port 80 only answers with a redirect to https.
      - "${HTTP_REDIRECT_PORT:-80}:80"
    environment:
      HTTPS_HOST: ${HTTPS_HOST:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificate authority lives here. Losing this volume means every
      # office computer must trust the new authority again.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-db-data:
  caddy-data:
  caddy-config:
